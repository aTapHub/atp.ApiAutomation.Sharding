# Shared storage for the test Job's cloned source + build output + report,
# and for the report-retrieval Pod that reads it back out afterward (a Job's
# own pod dies the instant its container exits, so kubectl cp/exec has
# nothing left to talk to by then). Mirrors Portfolio's
# test-workspace-pvc.yaml; named distinctly since this shares Portfolio's
# api-automation namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sharding-test-workspace
  namespace: api-automation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
