# Lives in api-automation, not a separate namespace - shares it with
# atp.ApiAutomation.Portfolio and this repo's own Job/PVC/image resources
# (a Phase 2 decision made after this manifest was first written), so the
# existing least-privilege ci-job-runner Role (scoped only to
# api-automation, RBAC/namespaces deliberately out of the CI pipeline's
# own reach) can apply it without any admin-side RBAC change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: api-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: api-automation
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
