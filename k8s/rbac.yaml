# One-time cluster setup, applied by an admin kubeconfig - not something the
# CI pipeline itself can or should reconcile (see dotnet-test.yml's own
# comment on why). Lets the dedicated sharding-runners ARC runner pods
# (ServiceAccount sharding-runners-gha-rs-no-permission, in namespace
# arc-runners) manage this repo's CI-owned resources in api-automation:
# the Kaniko build Job, the test/sharded-test Jobs, the workspace PVC, the
# report-retrieval Pod, and the rate-limiter Redis Deployment/Service.
#
# No Secrets permissions at all - unlike Portfolio's Role, there's no AUT
# here and nothing needs API credentials. Mounting the existing
# harbor-push-creds Secret for image pull doesn't require get/list RBAC on
# Secrets (mounting is gated by pod-create permission, not secret-read).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sharding-ci-job-runner
  namespace: api-automation
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"] # create/delete: the report-retrieval Pod
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"] # needed for `kubectl cp` (implemented over exec) to pull the test report out
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"] # the rate-limiter Redis Deployment
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"] # the rate-limiter Redis Service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sharding-ci-job-runner-binding
  namespace: api-automation
subjects:
  - kind: ServiceAccount
    name: sharding-runners-gha-rs-no-permission
    namespace: arc-runners
roleRef:
  kind: Role
  name: sharding-ci-job-runner
  apiGroup: rbac.authorization.k8s.io
